name: android-apk

# Builds the native Android app and publishes the APK as a downloadable
# artifact. There is no Android SDK in the development environment this was
# written in, so CI is where the native toolchain is actually exercised.

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug (fast, no shrinking) or release"
        required: false
        default: "debug"
        type: choice
        options: ["debug", "release"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # Pin Gradle rather than trusting whatever the runner image ships, so the
      # AGP version below always has a Gradle it supports.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install the pinned NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      # whisper.cpp is fetched by CMake at configure time; caching it keeps the
      # rebuild honest without re-cloning ~200 MB of history every run.
      - name: Cache the native build
        uses: actions/cache@v4
        with:
          path: |
            android/app/.cxx
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: android-${{ runner.os }}-

      - name: Build
        working-directory: android
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          echo "running $TASK"
          gradle --no-daemon --stacktrace "$TASK"

      - name: Locate the APK
        id: find
        working-directory: android
        run: |
          APK="$(find app/build/outputs/apk -name '*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then echo "::error::no APK produced"; exit 1; fi
          echo "path=android/$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          echo "### APK מוכן" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ivrit-transcribe-apk
          path: ${{ steps.find.outputs.path }}
          if-no-files-found: error
          retention-days: 30
